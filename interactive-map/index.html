<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>خريطة تفاعلية</title>
  <meta name="description" content="بوابة GIS حديثة لاستعراض أحياء ومباني وشوارع ومرافق المغازي">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Noto+Kufi+Arabic:wght@500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <link rel="stylesheet" href="https://unpkg.com/@geoman-io/leaflet-geoman-free@2.18.3/dist/leaflet-geoman.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <img src="images/image.png" alt="شعار البوابة" class="brand-logo">
      <div>
        <h1>خريطة تفاعلية</h1>
        <p>منصة مكانية حديثة لخدمات البلدية</p>
      </div>
    </div>

    <div class="global-search">
      <i class="fa-solid fa-magnifying-glass"></i>
      <input id="searchInput" type="search" placeholder="ابحث عن حي، شارع، مبنى أو مرفق...">
      <button id="searchClear" aria-label="مسح البحث"><i class="fa-solid fa-xmark"></i></button>
      <div id="searchResults" class="search-results"></div>
    </div>

    <div class="top-actions">
      <button id="themeBtn" class="icon-btn" title="الوضع الليلي"><i class="fa-solid fa-moon"></i></button>
      <button id="fullscreenBtn" class="icon-btn" title="ملء الشاشة"><i class="fa-solid fa-expand"></i></button>
      <button id="sidebarBtn" class="icon-btn mobile-only" title="الطبقات"><i class="fa-solid fa-layer-group"></i></button>
    </div>
  </header>

  <section class="stats-strip">
    <article><i class="fa-solid fa-building"></i><div><strong id="statBuildings">0</strong><span>مبنى</span></div></article>
    <article><i class="fa-solid fa-border-all"></i><div><strong id="statNeighborhoods">0</strong><span>حيًا</span></div></article>
    <article><i class="fa-solid fa-road"></i><div><strong id="statRoads">0</strong><span>شارع هيكلي</span></div></article>
    <article><i class="fa-solid fa-landmark"></i><div><strong id="statMunicipalFacilities">0</strong><span>مرفق بلدي</span></div></article>
    <article><i class="fa-solid fa-location-dot"></i><div><strong id="statPublicFacilities">0</strong><span>مرفق عام</span></div></article>
  </section>

  <main class="app-shell">
    <aside id="sidebar" class="sidebar">
      <div class="panel-header">
        <div>
          <span class="eyebrow">التحكم</span>
          <h2>الطبقات والفلاتر</h2>
        </div>
        <button id="closeSidebarBtn" class="close-panel"><i class="fa-solid fa-xmark"></i></button>
      </div>

      <section class="panel-section">
        <button class="section-toggle open"><span><i class="fa-solid fa-layer-group"></i> الطبقات</span><i class="fa-solid fa-chevron-down"></i></button>
        <div class="section-body">
          <label class="layer-row">
            <input type="checkbox" id="toggleBuildings" checked>
            <span class="swatch building-two"></span>
            <span>المباني السكنية</span>
            <b id="countBuildings">0</b>
          </label>
          <label class="layer-row">
            <input type="checkbox" id="toggleRoads" checked>
            <span class="swatch road"></span>
            <span>الشوارع</span>
            <b id="countRoads">0</b>
          </label>
      
          <label class="layer-row">
            <input type="checkbox" id="toggleMunicipalFacilities" checked>
            <span class="swatch facility"></span>
            <span>مرافق البلدية</span>
            <b id="countMunicipalFacilities">0</b>
          </label>
          <label class="layer-row">
            <input type="checkbox" id="togglePublicFacilities" checked>
            <span class="swatch public-facility"></span>
            <span>المرافق العامة</span>
            <b id="countPublicFacilities">0</b>
          </label>
              <label class="layer-row">
            <input type="checkbox" id="toggleNeighborhoods" checked>
            <span class="swatch neighborhood"></span>
            <span>الأحياء</span>
            <b id="countNeighborhoods">0</b>
          </label>
        </div>
      </section>

      <section class="panel-section">
        <button class="section-toggle open"><span><i class="fa-solid fa-sliders"></i> الفلاتر</span><i class="fa-solid fa-chevron-down"></i></button>
        <div class="section-body filters">
          <label>الحي
            <select id="neighborhoodFilter"><option value="">كل الأحياء</option></select>
          </label>
          <label>رقم المبنى
            <input id="buildingNumberFilter" type="text" placeholder="مثال: 125">
          </label>
          <label>رقم الشارع
            <input id="streetNumberFilter" type="text" placeholder="مثال: 18">
          </label>
          <button id="applyFiltersBtn" class="primary-btn"><i class="fa-solid fa-filter"></i> تطبيق</button>
          <button id="resetFiltersBtn" class="ghost-btn"><i class="fa-solid fa-rotate-left"></i> إعادة الضبط</button>
        </div>
      </section>

      <section class="panel-section">
        <button class="section-toggle open"><span><i class="fa-solid fa-map"></i> مفتاح الخريطة</span><i class="fa-solid fa-chevron-down"></i></button>
        <div class="section-body legend">
          <div><span class="swatch building-two"></span> المباني السكنية</div>
          <div><span class="swatch road"></span> الشوارع</div>
        
          <div><span class="swatch facility"></span> مرافق البلدية</div>
          <div><span class="swatch public-facility"></span> المرافق العامة</div>
           <div><span class="swatch neighborhood"></span> الأحياء</div>
        </div>
      </section>
    </aside>

    <section class="map-area">
      <div id="map"></div>

      <div class="map-toolbar">
        <button id="homeBtn" title="العودة إلى المغازي"><i class="fa-solid fa-house"></i></button>
        <button id="locateBtn" title="تحديد موقعي"><i class="fa-solid fa-location-crosshairs"></i></button>
        <button id="basemapBtn" title="تغيير الخريطة"><i class="fa-solid fa-satellite"></i></button>
        <button id="measureDistanceBtn" title="قياس مسافة"><i class="fa-solid fa-ruler"></i></button>
        <button id="measureAreaBtn" title="قياس مساحة"><i class="fa-solid fa-draw-polygon"></i></button>
        <button id="printBtn" title="طباعة"><i class="fa-solid fa-print"></i></button>
      </div>

      <div id="basemapMenu" class="basemap-menu">
         <button data-map="satellite" class="active">الأقمار الصناعية</button>
        <button data-map="street" >خريطة الشوارع</button>
      
      </div>

      <div class="map-status">
        <span id="coordWgs">—</span>
        <span id="zoomLevel">Zoom 15</span>
      </div>
    </section>

    <aside id="detailsPanel" class="details-panel">
      <button id="closeDetailsBtn" class="close-details"><i class="fa-solid fa-xmark"></i></button>
      <div class="details-hero">
        <span id="detailType" class="detail-badge">عنصر</span>
        <h2 id="detailTitle">تفاصيل العنصر</h2>
        <p id="detailSubtitle">اضغط على أي عنصر في الخريطة</p>
      </div>
      <div id="detailFields" class="detail-fields"></div>
      <div class="detail-actions">
        <a id="googleMapsBtn" href="#" target="_blank" rel="noopener"><i class="fa-brands fa-google"></i> Google Maps</a>
        <button id="copyCoordsBtn"><i class="fa-regular fa-copy"></i> نسخ الإحداثيات</button>
        <button id="shareBtn"><i class="fa-solid fa-share-nodes"></i> مشاركة</button>
        <button id="printDetailsBtn"><i class="fa-solid fa-print"></i> طباعة</button>
        <a id="complaintBtn" href="https://script.google.com/macros/s/AKfycbxHV85gTu5TkE93USrnR8jcIe5VhsWNLK1DXh8B6lazpi30cEFf6DKAoptzewa0hOqZyw/exec" target="_blank" rel="noopener" class="complaint"><i class="fa-solid fa-triangle-exclamation"></i> تقديم بلاغ عن الموقع</a>
      </div>
    </aside>
  </main>

  <div id="toast" class="toast"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="https://unpkg.com/@geoman-io/leaflet-geoman-free@2.18.3/dist/leaflet-geoman.min.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
